repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-case-conflict
  - repo: local
    hooks:
      - id: unwanted-file-extensions
        name: Unwanted file extensions
        entry: Do not commit compiled files, backups or temporary files.
        language: fail
        files: '(?i)\.(py[co]|exe|dll|bak|tmp|orig|rej)$'
      - id: ruff
        name: Ruff
        entry: python -m ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest with coverage
        entry: python -m pytest
        language: system
        pass_filenames: false
        always_run: true
